name: Deploy personal ClaimClock
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: claimclock-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'ketan952/claimclock' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Reviewed AGPL-compatible dependency snapshot and runtime notice hashes.
      # Changed dependencies or unreviewed licenses fail closed.
      - run: npm run licenses:release
      - name: Apply provisioned D1 migrations
        if: vars.CLOUDFLARE_D1_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply claimclock --remote
      - name: Deploy static assets and optional API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
