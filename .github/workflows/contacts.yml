name: Verify published contacts
on:
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: contact-verification
  cancel-in-progress: false
jobs:
  contacts:
    if: github.repository == 'ketan952/claimclock'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF text extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify contact values on primary sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-contacts.mjs --write --issues
      - name: Commit verified date changes only
        run: |
          if git diff --quiet -- data/contacts.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contacts.json
          git commit -m 'data: renew content-confirmed contact verification dates'
          git push origin HEAD:main
