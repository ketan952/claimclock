name: Live production QA

on:
  workflow_dispatch:
    inputs:
      expected_build:
        description: Expected production build ID (16 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser:
    if: github.repository == 'ketan952/claimclock'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_BASE_URL: https://claimclock.ketan952.workers.dev
      QA_LIVE_TURNSTILE: '1'
      PLAYWRIGHT_JSON_OUTPUT_NAME: qa/browser-results.json
    steps:
      - uses: actions/checkout@v4
      - name: Remove previous QA artifacts
        run: |
          mkdir -p qa/screenshots .cache
          rm -f qa/browser-results.json qa/worker-source-navigation.json qa/turnstile-failures.json qa/screenshots/worker-source*.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Verify the expected production build
        env:
          EXPECTED_BUILD: ${{ inputs.expected_build }}
        run: |
          node --input-type=module <<'NODE'
          const expected = process.env.EXPECTED_BUILD;
          if (!/^[a-f0-9]{16}$/.test(expected ?? '')) {
            throw new Error('expected_build must be a 16-character lowercase hexadecimal build ID.');
          }
          const response = await fetch('https://claimclock.ketan952.workers.dev/build.json', {
            cache: 'no-store',
            signal: AbortSignal.timeout(20000),
          });
          if (!response.ok) throw new Error(`Build check failed: HTTP ${response.status}`);
          const { buildId } = await response.json();
          if (buildId !== expected) throw new Error(`Expected build ${expected}; production serves ${buildId}.`);
          console.log(`Verified production build ${buildId}.`);
          NODE
      - name: Run production browser checks
        run: >-
          npx playwright test --workers=2 --retries=0 --reporter=list,json
          --grep-invert 'live Privacy form|live blank-city UI|live AI explanation|encrypted case transfer round trip'
      - name: Upload selected QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-production-qa-${{ github.run_id }}
          retention-days: 10
          if-no-files-found: warn
          path: |
            qa/browser-results.json
            qa/worker-source-navigation.json
            qa/turnstile-failures.json
            qa/screenshots/worker-source*.png
