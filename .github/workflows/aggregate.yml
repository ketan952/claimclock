name: Patient aggregate maintenance fallback
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: patient-aggregate-maintenance
  cancel-in-progress: false
jobs:
  aggregate:
    if: github.repository == 'ketan952/claimclock' && vars.CLOUDFLARE_AGGREGATE_FALLBACK == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run the same SQL maintenance as Workers Cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute claimclock --remote --file worker/aggregate.sql
